[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Functions need Node 18+ for built-in fetch / AbortSignal.timeout.
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# Hostname short-links (tldr / demo / visaverify / thesis) now live in
# middleware.ts. The former netlify/edge-functions/ pair is removed.
#
# Scheduled function: netlify/functions/keep-alive.mjs declares its own
# schedule() of "*/14 * * * *".
